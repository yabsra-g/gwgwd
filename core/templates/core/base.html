{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gather Wood, Gather Words</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}?v=1.1">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <div class="logo">
            <a href="{% url 'home' %}">Gather Wood, Gather Words</a>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav">
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'projects' %}">Projects</a></li>
                <li><a href="{% url 'activity_list' %}">Activities</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-logo">Gather Wood, Gather Words &copy; {% now "Y" %}</div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>
    <script>
        document.querySelector('.nav-toggle').addEventListener('click', function () {
            document.querySelector('.site-nav').classList.toggle('nav-open');
            this.classList.toggle('active');
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
