{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="map-page" style="padding: 100px 20px 60px; text-align: center;">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem;">Projects</h1>
    <p style="max-width: 600px; margin: 0 auto 2rem; color: #666; font-size: 1.05rem;">
        Explore our projects by region. Click a highlighted country to view its works.
    </p>

    <!-- SVG Map Container -->
    <div id="map-container" style="max-width: 1100px; margin: 0 auto; position: relative;">
        <div id="map-wrapper" style="width: 100%; overflow: hidden; border-radius: 12px; background: #f5f0eb; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 2rem;">
            <object id="world-map" data="{% static 'core/world.svg' %}" type="image/svg+xml"
                style="width: 100%; height: auto; display: block;"></object>
        </div>
        <!-- Tooltip -->
        <div id="map-tooltip"
            style="display: none; position: fixed; background: #333; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; pointer-events: none; z-index: 1000; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
        </div>
    </div>

    <!-- Legend -->
    <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 2rem; font-size: 0.9rem; color: #666;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #8B5E3C; display: inline-block;"></span>
            Active Projects
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="width: 16px; height: 16px; border-radius: 3px; background: #ddd; display: inline-block;"></span>
            No Projects
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    const activeCountries = {{ active_countries_json|safe }};
    const svgObj = document.getElementById('world-map');
    const tooltip = document.getElementById('map-tooltip');

    svgObj.addEventListener('load', function() {
        const svgDoc = svgObj.contentDocument;
        if (!svgDoc) return;

        const allPaths = svgDoc.querySelectorAll('path[id]');

        allPaths.forEach(function(path) {
            const isoCode = path.getAttribute('id');

            if (activeCountries[isoCode]) {
                // Active country: highlighted & clickable
                path.style.fill = '#8B5E3C';
                path.style.cursor = 'pointer';
                path.style.transition = 'fill 0.2s ease, opacity 0.2s ease';

                path.addEventListener('mouseenter', function(e) {
                    path.style.fill = '#6d4930';
                    tooltip.textContent = activeCountries[isoCode];
                    tooltip.style.display = 'block';
                });

                path.addEventListener('mousemove', function(e) {
                    tooltip.style.left = (e.clientX + 12) + 'px';
                    tooltip.style.top = (e.clientY - 30) + 'px';
                });

                path.addEventListener('mouseleave', function() {
                    path.style.fill = '#8B5E3C';
                    tooltip.style.display = 'none';
                });

                path.addEventListener('click', function() {
                    window.location.href = '/projects/' + encodeURIComponent(activeCountries[isoCode]) + '/';
                });
            } else {
                // Inactive country: grayed out, no interaction
                path.style.fill = '#ddd';
                path.style.cursor = 'default';
                path.style.pointerEvents = 'none';
            }
        });

        // Style the SVG background
        const svgEl = svgDoc.querySelector('svg');
        if (svgEl) {
            svgEl.style.background = 'transparent';
        }
    });
})();
</script>
{% endblock %}
